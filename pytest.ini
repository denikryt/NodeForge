[pytest]
testpaths = tests
markers =
    unit: ordinary CPython tests that do not require Blender or bpy
    blender: tests that require Blender's Python runtime and bpy-compatible package bootstrap
    blender_eval: tests that evaluate Blender modifiers/depsgraph
    benchmark: optional benchmark tests, normally skipped unless NODEFORGE_LSYSTEM_BENCHMARK=1
    slow: expensive regression tests
